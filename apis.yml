aid: webcrawlerapi-com
name: WebCrawlerAPI
description: 'WebCrawlerAPI is a web crawling and scraping API from 103 Labs (Netherlands) that turns websites into
  clean, LLM-ready markdown, cleaned text, HTML or link lists for AI agents, support bots and RAG pipelines. It
  offers asynchronous multi-page crawl jobs (POST /v1/crawl with polling or webhooks), single-page scraping (POST
  /v2/scrape, sync or async, with prompt-based structured outputs validated against a JSON Schema), scheduled change-detection
  Feeds delivered as Atom 1.0, JSON Feed 1.1 or webhooks, a prompt-driven autonomous crawling agent with a required
  per-run spend cap, and organization usage/balance endpoints. Requests authenticate with a Bearer API key; usage
  is metered per successfully crawled page on a $0/month pay-as-you-go tier or $29/$99/$499 monthly plans, with
  7-day caching (cache hits free). Published surfaces: a Swagger 2.0 document behind a live Swagger UI, an Agent
  API OpenAPI 3.0.3, an A2A agent card and RFC 9727 API catalog at /.well-known/, llms.txt, SDKs for JavaScript,
  Python, PHP, .NET and Java, an npm MCP server (local stdio), the webcr CLI, a Claude Code Agent Skill, a public
  Postman collection and a dated changelog.'
image: https://webcrawlerapi.com/favicon.png
url: https://raw.githubusercontent.com/api-evangelist/webcrawlerapi-com/refs/heads/main/apis.yml
