apis:
- aid: webcrawlerapi-com:webcrawler-api
  name: WebCrawler API
  description: REST API on api.webcrawlerapi.com for asynchronous multi-page crawl jobs (POST /v1/crawl, GET /v1/job/{id},
    cancel, urls, combined markdown, webhook resend), single-page scraping (POST /v2/scrape sync or ?async=true,
    GET /v2/scrape/{id}) with output_formats, main_content_only, clean_selectors, max_age caching and prompt + response_schema
    structured outputs, scheduled change-detection Feeds (POST /v2/feed, Atom 1.0 and JSON Feed 1.1 renderings,
    pause/resume/run/delete), the autonomous crawling agent (POST /v1/agent with a required max_spend_usd) and organization
    usage. 24 operations published as Swagger 2.0 at https://api.webcrawlerapi.com/swagger/doc.json behind a live
    Swagger UI; Bearer API-key auth.
  humanURL: https://webcrawlerapi.com/docs/getting-started
