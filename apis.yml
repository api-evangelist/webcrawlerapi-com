- aid: webcrawlerapi-com:webcrawlerapi-mcp-server
  name: WebCrawlerAPI MCP Server
  description: 'Official Model Context Protocol server distributed as the npm package webcrawler-mcp (npx -y webcrawler-mcp)
    and run locally over stdio - or self-hosted over streamable HTTP with USE_HTTP=true - by the user; there is
    no provider-hosted remote endpoint. It exposes one tool, webcrawler-scrape (url, optional prompt, optional main_content_only),
    which POSTs to https://api.webcrawlerapi.com/v2/scrape with the API key from the WEBCRAWLER_API_KEY environment
    variable and returns markdown (or structured_data when a prompt is set). Source: github.com/WebCrawlerAPI/webcrawlerapi-mcp.'
  humanURL: https://webcrawlerapi.com/docs/sdk/mcp
  baseURL: https://api.webcrawlerapi.com
