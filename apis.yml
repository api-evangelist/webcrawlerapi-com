- aid: webcrawlerapi-com:webcrawlerapi-a2a-agent-card
  name: WebCrawlerAPI Agent Card
  description: 'A2A-style agent card served from https://webcrawlerapi.com/.well-known/agent-card.json describing
    "WebCrawlerAPI Agent" (version 1.0.0) with three skills - scrape, crawl and crawling-agent - Bearer securitySchemes,
    text/markdown/JSON input and output modes, a healthCheckUrl and an openapi_url pointing at the Agent API OpenAPI.
    Graded FLAVORED against A2A 1.0.0: protocolVersion is absent and the card''s url is the REST base path https://api.webcrawlerapi.com/v1,
    which does not answer A2A JSON-RPC (a tasks/get POST returns 404). It is a real, provider-served discovery document
    for the REST API rather than a working A2A endpoint.'
  humanURL: https://webcrawlerapi.com/docs/getting-started
  baseURL: https://api.webcrawlerapi.com/v1
