observed_but_not_claimed:
- signal: data_subject_request
  why_not: The privacy policy (https://webcrawlerapi.com/privacy) names a contact (support@webcrawlerapi.com) but
    states no rights, no request process and no response period, and links to a DPA that is not served (/legal/dpa
    and /dpa -> 307 /404). Below the substance bar.
- signal: age_assurance
  why_not: ToS requires users to be 18+ (or the age of majority); that is an eligibility clause, not an assurance
    mechanism.
- signal: data_residency
  why_not: Sub-processor locations are listed (EU/US/Global) but no residency commitment or region selection is
    offered.
- signal: incident_notification
  why_not: No breach/incident notification commitment is published; the 30-day notice on the sub-processor page
    concerns vendor changes only.
- signal: exit_assistance
  why_not: The refund policy covers money, not data export. The combined-markdown export is a product feature, not
    an exit commitment.
