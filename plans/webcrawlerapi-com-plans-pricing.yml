summary: 'Four self-serve tiers priced publicly in USD: a $0/month pay-as-you-go tier and three monthly subscriptions
  ($29 / $99 / $499) that lower the per-page rate and raise the parallel-request ceiling. Usage is metered per successfully
  crawled page; agent runs and prompt-based scrapes add a per-LLM-token charge; cache hits are free (since 2026-09-02).
