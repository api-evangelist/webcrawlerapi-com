method: probed
source: live probes of /.well-known/ on every WebCrawlerAPI host known to this record (apex, www, API, dashboard,
  content CDN, status page)
summary: 'Two real documents are served, both on the apex host webcrawlerapi.com: an RFC 9727 API catalog linkset
  at /.well-known/api-catalog (application/linkset+json, anchoring the getting-started docs as service-doc and the
  Postman collection as item) and an A2A agent card at /.well-known/agent-card.json (application/json; graded flavored
  in a2a/). Those two 200s earn the WellKnown pointer. Nothing else is served on any host: no security.txt (so NO
  SecurityTxt pointer), no OIDC discovery, no RFC 8414 or RFC 9728 OAuth metadata (the API is Bearer API-key only,
  no OAuth exists), no ai-plugin.json, no legacy agent.json. There is no MCP host to probe: the provider''s MCP
  server is a local stdio package (mcp/), and mcp.webcrawlerapi.com does not resolve.'
pointer_basis: WellKnown pointer emitted on the strength of the api-catalog and agent-card 200s on webcrawlerapi.com.
  SecurityTxt pointer NOT emitted - RFC 9116 is unimplemented on every host.
false_positive_watch: The apex host answers unknown /.well-known/* paths with a 307 to https://webcrawlerapi.com/404
  rather than a 200 shell, so its two 200s are genuine. status.webcrawlerapi.com (Better Stack) 301s every /.well-known/*
  path back to its root - those are recorded as misses.
