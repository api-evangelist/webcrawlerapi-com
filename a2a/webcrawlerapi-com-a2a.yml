agent_card:
  name: WebCrawlerAPI Agent
  description: AI-powered web crawling and scraping agent. Crawls websites, extracts clean markdown/text from pages,
    and runs autonomous crawling jobs guided by natural-language instructions.
  url: https://api.webcrawlerapi.com/v1
  version: 1.0.0
  protocol_version: null
  preferred_transport: null
  provider:
    organization: WebCrawlerAPI
    url: https://webcrawlerapi.com
  documentation_url: https://webcrawlerapi.com/docs/getting-started
  icon_url: https://webcrawlerapi.com/favicon.png
  capabilities:
