grade:
  a2a_version: 1.0.0
  result: flavored
  hard_checks:
    capabilities_is_object: true
    protocolVersion_present: false
    skills_is_array: true
  optional_checks:
    preferredTransport: false
    defaultInputModes: true
    defaultOutputModes: true
  rationale: 'Fails one hard check: protocolVersion is absent, so a client cannot tell which A2A revision the card
    targets. Beyond the checklist, url is the REST API base path (https://api.webcrawlerapi.com/v1) rather than
    an A2A endpoint - a JSON-RPC POST there 404s - and the card carries two non-standard members (openapi_url, healthCheckUrl)
    that read as an OpenAPI-style service descriptor wearing the AgentCard shape. What it does well: capabilities
    is an object, skills is a well-formed array with ids/tags/examples/input+output modes, provider and documentationUrl
    are set, and securitySchemes/security use the AgentCard security shape correctly.'
deviations:
- field: protocolVersion
  issue: missing
  severity: hard
  fix: 'Add "protocolVersion": "0.3.0" (or the revision implemented).'
- field: url
  issue: Points at the REST base path https://api.webcrawlerapi.com/v1, which does not answer A2A JSON-RPC (POST
    -> 404 page not found).
  severity: hard-adjacent
  fix: Point url at a real A2A endpoint, or if the intent is REST discovery keep this card but say so - agents that
    follow the A2A spec will POST JSON-RPC here and fail.
- field: preferredTransport
  issue: missing (optional; defaults to JSONRPC, which is not what the url serves).
  severity: optional
- field: openapi_url / healthCheckUrl
  issue: Not AgentCard members. Harmless to spec-tolerant parsers but not portable.
  severity: informational
  fix: Move to additionalInterfaces / documentationUrl, or an extension namespace.
- field: capabilities.pushNotifications
  issue: Declared true. The REST API does support webhook_url callbacks on jobs and feeds, but there is no A2A tasks/pushNotificationConfig
    endpoint behind this card.
  severity: informational
skills_vs_rest:
  scrape: POST /v2/scrape (createScrapeV2 in overlays/)
  crawl: POST /v1/crawl + GET /v1/job/{id} (createCrawlJob, getJob)
  crawling-agent: POST /v1/agent + GET /v1/agent/job/{id} (runAgent, getAgentJob) - the only skill covered by the
    card's own openapi_url document
